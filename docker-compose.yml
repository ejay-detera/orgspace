services:
  # ============================================
  # Laravel Application
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orgspace-app
    ports:
      - "8005:80"
    environment:
      APP_NAME: OrgSpace
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8005
      APP_TIMEZONE: UTC
      APP_LOCALE: en
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: orgspace
      DB_USERNAME: orgspace
      DB_PASSWORD: orgspace
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
      MAIL_MAILER: log
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - orgspace-network
    restart: unless-stopped

  # ============================================
  # MySQL Database
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: orgspace-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orgspace
      MYSQL_USER: orgspace
      MYSQL_PASSWORD: orgspace
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - orgspace-network
    restart: unless-stopped

  # ============================================
  # phpMyAdmin (Database Management UI)
  # ============================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: orgspace-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: orgspace
      PMA_PASSWORD: orgspace
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - orgspace-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  orgspace-network:
    driver: bridge
